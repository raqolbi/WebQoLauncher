# Nginx untuk Next.js static export (output: 'export')
# Mount: /etc/nginx/conf.d/default.conf  |  Root: /usr/share/nginx/html (public/ atau out/)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;

    # ── Next.js build chunks (immutable) ─────────────────────────────
    location /_next/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /_next/ {
        try_files $uri =404;
    }

    # ── Asset statis — jangan fallback ke index.html ─────────────────
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~* \.(?:css|js|mjs|map|json|jpg|jpeg|png|gif|ico|svg|webp|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Client routes: /login, /dashboard, /profile, ... ───────────
    # Urutan penting untuk Next.js export (login.html / login/index.html)
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}
