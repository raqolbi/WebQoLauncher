# Nginx untuk Next.js static export (output: 'export') di dalam container app.
# Mount ke /etc/nginx/conf.d/default.conf — root: /usr/share/nginx/html (folder public/ / out/)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Next.js static chunks (immutable) ─────────────────────────────
    # GET /_next/static/chunk.js → file asli (bukan index.html)
    location /_next/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /_next/ {
        try_files $uri $uri/ =404;
    }

    # ── Asset publik (favicon, gambar, font, css, js di luar _next) ───
    location ~* \.(?:css|js|mjs|map|jpg|jpeg|png|gif|ico|svg|webp|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Client-side routes (SPA / Next.js App Router static) ──────────
    # GET /login, /dashboard, /profile → index.html jika file tidak ada
    # Mendukung trailingSlash (login/index.html) dan flat (login.html)
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
